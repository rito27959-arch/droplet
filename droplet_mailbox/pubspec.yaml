name: droplet_mailbox
description: Boîte aux lettres Droplet — messages chiffrés en attente, stockés dans Postgres
version: 2.0.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  postgres: ^3.5.0
  cryptography: ^2.7.0
  crypto: ^3.0.3
  http: ^1.2.0
  # La signature ES256 des notifications de Droplet Web (VAPID).
  pointycastle: ^3.9.1

dev_dependencies:
  test: ^1.25.0
