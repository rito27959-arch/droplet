[workspace]
resolver = "2"
members = [
  "crates/drop_core",
  "crates/drop_crypto",
  "crates/drop_transfer",
  "crates/drop_discovery",
  "crates/drop_storage",
  "crates/drop_web",
  "apps/droplet_drop_flutter/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
