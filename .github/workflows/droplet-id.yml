name: Droplet ID
# Le serveur (mémoire et PostgreSQL), puis CHAQUE kit contre un vrai service :
# Node, Python, PHP et Go de bout en bout ; Flutter et Kotlin compilés et testés.
on:
  push:
    branches: [droplet-id]
    paths: ['droplet-id/**', 'lib/features/droplet_id/**', 'tool/droplet_id_appareil.dart', 'test/droplet_id/**', '.github/workflows/droplet-id.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  serveur-et-kits:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: essai, POSTGRES_DB: dropletid }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: openssl, coverage: none }
      - run: pip install cryptography
      - name: Serveur — tests (mémoire)
        working-directory: droplet-id/serveur
        run: npm ci && npm test
      - name: Serveur — tests (PostgreSQL)
        working-directory: droplet-id/serveur
        env: { TEST_DATABASE_URL: 'postgres://postgres:essai@localhost:5432/dropletid' }
        run: npm test
      - name: Kits — de bout en bout (Node, Python, PHP, Go)
        working-directory: droplet-id/kits
        run: |
          (cd node && npm install --no-audit --no-fund)
          (cd go && go mod tidy && go vet ./...)
          (cd essais/go && go mod tidy)
          node essais/e2e.mjs | tee /tmp/e2e.txt
          for k in node python php go; do grep -q "✓ $k" /tmp/e2e.txt || { echo "kit $k non vérifié"; exit 1; }; done

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Kit Flutter
        working-directory: droplet-id/kits/flutter
        run: flutter pub get && flutter analyze --no-fatal-infos && flutter test
      - name: App Droplet — module Droplet ID (analyse, tests, et une vraie connexion approuvée par le protocole Dart)
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/droplet_id tool/droplet_id_appareil.dart lib/main.dart lib/features/settings/settings_screen.dart
          flutter test test/droplet_id
          (cd droplet-id/serveur && npm ci)
          node droplet-id/kits/essais/e2e-appareil-dart.mjs

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - working-directory: droplet-id/kits/kotlin
        run: gradle --no-daemon :droplet-id:testDebugUnitTest :droplet-id:assembleRelease
