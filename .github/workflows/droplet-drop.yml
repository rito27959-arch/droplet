# DROPLET DROP — vérification et compilation sur les cinq plateformes.
#
#   moteur   : tests Rust réels (TLS, reprise, 30 destinataires, pairs
#              malveillants) + mesures volumineuses (1 Go, 30 × 200 Mo)
#   generer  : code du pont Rust ↔ Dart (flutter_rust_bridge), recommité
#              s'il a changé ; analyse ; captures d'écran ; build Linux
#   android  : APK (arm64, armv7, x86_64)
#   windows  : build Windows
#   apple    : build macOS + iOS (sans signature)
#   publier  : quand tout est vert, la publication « drop-latest » (une
#              préversion, pour ne jamais devenir la « dernière version »
#              de Droplet, la messagerie) reçoit les fichiers que
#              drop.dropletmesh.app propose au téléchargement :
#              DropletDrop-android-arm64.apk (+ armv7, x86_64),
#              DropletDrop-windows-x64.zip, DropletDrop-macos.zip,
#              DropletDrop-linux-x64.tar.gz
#
# Chaque tâche publie son journal sur une branche `journal-drop-<tâche>`,
# et les applications compilées en artefacts téléchargeables.
name: Droplet Drop
on:
  push:
    branches: [droplet-drop]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: droplet-drop
  cancel-in-progress: true

env:
  APP: apps/droplet_drop_flutter
  FRB: "2.13.0"

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests du moteur
        run: |
          set +e
          {
            echo "== tests"; cargo test --release --workspace --exclude rust_lib_droplet_drop 2>&1 | grep -E "^test |test result|MESURE|MULTICAST|panicked|error"
            echo "code tests: ${PIPESTATUS[0]}"
            echo "== mesures volumineuses"
            /usr/bin/time -v env DROP_TEST_GRAND=1 cargo test --release -p drop_transfer --test transferts mesures_volumineuses -- --nocapture 2>&1 | grep -E "MESURE|test result|Maximum resident|Elapsed"
          } > journal.txt 2>&1
          cat journal.txt
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q --orphan journal-drop-moteur; git rm -rfq --cached . >/dev/null
          git add journal.txt; git commit -qm journal; git push -fq origin journal-drop-moteur
          grep -q "code tests: 0" journal.txt

  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ env.FRB }}
      - name: Dépendances Linux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev > /dev/null
      - name: Pont Rust ↔ Dart, analyse, captures, build Linux
        run: |
          set +e
          command -v flutter_rust_bridge_codegen || cargo install flutter_rust_bridge_codegen --version $FRB --locked
          cd $APP
          {
            flutter pub get 2>&1 | tail -3
            echo "== codegen"; flutter_rust_bridge_codegen generate > /tmp/frb.txt 2>&1; echo "code codegen: $?"; tail -20 /tmp/frb.txt
            echo "== analyse"; flutter analyze --no-fatal-infos 2>&1 | tail -60
            echo "== captures"; flutter test --update-goldens test/captures_test.dart 2>&1 | grep -vE "^\s*$" | tail -60
            echo "== build linux"; flutter build linux --release > /tmp/linux.txt 2>&1; echo "code linux: $?"; tail -30 /tmp/linux.txt
          } > /tmp/journal.txt 2>&1
          cd -
          cat /tmp/journal.txt
          git config user.name ci; git config user.email ci@users.noreply.github.com
          # Le code généré revient dans la branche (pour compiler sans l'outil).
          git add $APP/lib/src/rust $APP/rust/src/frb_generated.rs
          if ! git diff --cached --quiet; then git commit -qm "Pont Rust ↔ Dart régénéré [ci]" && git push -q origin HEAD:droplet-drop; fi
          mkdir -p /tmp/sortie && cp /tmp/journal.txt /tmp/sortie/ && cp -r $APP/test/captures /tmp/sortie/ 2>/dev/null
          git checkout -q --orphan journal-drop-generer; git rm -rfq --cached . >/dev/null
          rm -rf journal.txt captures; cp -r /tmp/sortie/* .
          git add journal.txt; git add captures 2>/dev/null; git commit -qm journal; git push -fq origin journal-drop-generer
          grep -q "code linux: 0" /tmp/journal.txt
      - name: Archive Linux
        run: |
          mkdir -p /tmp/publier
          cp -r $APP/build/linux/x64/release/bundle /tmp/publier/DropletDrop
          tar -C /tmp/publier -czf /tmp/publier/DropletDrop-linux-x64.tar.gz DropletDrop
      - uses: actions/upload-artifact@v4
        with:
          name: droplet-drop-linux
          path: /tmp/publier/DropletDrop-linux-x64.tar.gz

  android:
    needs: generer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: droplet-drop }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: dtolnay/rust-toolchain@stable
      # La clé de signature des versions publiées (secrets du dépôt) : la
      # même à chaque version, pour que les mises à jour s'installent par-
      # dessus et que les liens d'invitation ouvrent l'app directement.
      - name: Clé de signature
        env:
          CLE: ${{ secrets.DROP_ANDROID_CLE }}
          MDP: ${{ secrets.DROP_ANDROID_MDP }}
        run: |
          if [ -n "$CLE" ] && [ -n "$MDP" ]; then
            printf '%s' "$CLE" | base64 -d > "$RUNNER_TEMP/droplet-drop.jks"
            # Vérifier que le mot de passe ouvre bien le keystore avant de
            # l'utiliser pour le build : un mauvais mot de passe ne doit pas
            # faire échouer le build, juste retomber sur la clé de débogage.
            if keytool -list -keystore "$RUNNER_TEMP/droplet-drop.jks" -storepass "$MDP" -storetype PKCS12 > /dev/null 2>&1; then
              echo "DROP_KEYSTORE=$RUNNER_TEMP/droplet-drop.jks" >> "$GITHUB_ENV"
              echo "Signature : clé de publication"
            else
              rm -f "$RUNNER_TEMP/droplet-drop.jks"
              echo "::warning::Le mot de passe du keystore est incorrect : APK signés avec une clé de débogage. Vérifiez le secret DROP_ANDROID_MDP."
            fi
          else
            echo "::warning::Secrets DROP_ANDROID_CLE ou DROP_ANDROID_MDP absents : APK signés avec une clé de débogage (les mises à jour ne s'installeront pas par-dessus)."
          fi
      - name: APK
        env:
          DROP_KEYSTORE_MDP: ${{ secrets.DROP_ANDROID_MDP }}
        run: |
          set +e
          cd $APP
          flutter build apk --release --split-per-abi > /tmp/journal.txt 2>&1; echo "code android: $?" >> /tmp/journal.txt
          tail -40 /tmp/journal.txt
          cd -
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q --orphan journal-drop-android; git rm -rfq --cached . >/dev/null
          tail -80 /tmp/journal.txt > journal.txt; git add journal.txt; git commit -qm journal; git push -fq origin journal-drop-android
          grep -q "code android: 0" /tmp/journal.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: droplet-drop-android
          path: ${{ env.APP }}/build/app/outputs/flutter-apk/app-*-release.apk

  windows:
    needs: generer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: droplet-drop }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows
        shell: bash
        run: |
          set +e
          cd $APP
          flutter build windows --release > /tmp/journal.txt 2>&1; echo "code windows: $?" >> /tmp/journal.txt
          tail -40 /tmp/journal.txt
          cd -
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q --orphan journal-drop-windows; git rm -rfq --cached . >/dev/null
          tail -80 /tmp/journal.txt > journal.txt; git add journal.txt; git commit -qm journal; git push -fq origin journal-drop-windows
          grep -q "code windows: 0" /tmp/journal.txt
      - name: Archive Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publier | Out-Null
          Copy-Item -Recurse "$env:APP/build/windows/x64/runner/Release" "publier/Droplet Drop"
          Compress-Archive -Path "publier/Droplet Drop" -DestinationPath publier/DropletDrop-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: droplet-drop-windows
          path: publier/DropletDrop-windows-x64.zip

  apple:
    needs: generer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: droplet-drop }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # Les cibles Rust d'Apple : la bibliothèque du moteur est compilée
      # pour chacune (iPhone, simulateur Apple silicon et Intel, Mac).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build macOS et iOS
        run: |
          set +e
          cd $APP
          # iOS : sans compte Apple, on vérifie que tout COMPILE (simulateur) ;
          # la compilation pour iPhone est tentée et son journal gardé, mais
          # elle exige une équipe de signature pour aboutir.
          { flutter build macos --release 2>&1 | tail -40; echo "code macos: ${PIPESTATUS[0]}"
            flutter build ios --release --no-codesign > /tmp/ios.txt 2>&1; echo "code ios appareil: $?"
            grep -E "error:|Signing|requires a development team" /tmp/ios.txt | sort -u | head -20
            flutter build ios --simulator --debug > /tmp/ios-sim.txt 2>&1; c=$?
            grep -E "error(\[E[0-9]+\])?:|SEVERE: (Error|Exception|Failed|error)" /tmp/ios-sim.txt | sort -u | head -30
            tail -8 /tmp/ios-sim.txt; echo "code ios: $c"; } > /tmp/journal.txt
          cat /tmp/journal.txt
          cd -
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q --orphan journal-drop-apple; git rm -rfq --cached . >/dev/null
          cp /tmp/journal.txt journal.txt; git add journal.txt; git commit -qm journal; git push -fq origin journal-drop-apple
          grep -q "code macos: 0" /tmp/journal.txt && grep -q "code ios: 0" /tmp/journal.txt
      # ditto garde les liens symboliques et les droits du paquet .app
      # (un zip ordinaire casserait les frameworks).
      - name: Archive macOS
        run: |
          mkdir -p /tmp/publier
          ditto -c -k --sequesterRsrc --keepParent "$APP/build/macos/Build/Products/Release/Droplet Drop.app" /tmp/publier/DropletDrop-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: droplet-drop-macos
          path: /tmp/publier/DropletDrop-macos.zip

  publier:
    needs: [generer, android, windows, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: droplet-drop }
      - uses: actions/download-artifact@v4
        with: { path: /tmp/artefacts, pattern: droplet-drop-*, merge-multiple: true }
      - name: Publication drop-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd /tmp/artefacts
          mv app-arm64-v8a-release.apk DropletDrop-android-arm64.apk
          mv app-armeabi-v7a-release.apk DropletDrop-android-armv7.apk
          mv app-x86_64-release.apk DropletDrop-android-x86_64.apk
          ls -la
          sha256sum DropletDrop-* > SHA256SUMS.txt
          cd -
          # L'étiquette suit le dernier commit vert de la branche.
          git tag -f drop-latest
          git push -f origin refs/tags/drop-latest
          notes="Droplet Drop, compilé depuis la branche droplet-drop ($(git rev-parse --short HEAD)). Applications non signées : voir drop.dropletmesh.app pour les précautions d'ouverture. Empreintes : SHA256SUMS.txt."
          if gh release view drop-latest >/dev/null 2>&1; then
            gh release edit drop-latest --prerelease --title "Droplet Drop (dernière compilation)" --notes "$notes"
          else
            gh release create drop-latest --prerelease --title "Droplet Drop (dernière compilation)" --notes "$notes"
          fi
          gh release upload drop-latest --clobber /tmp/artefacts/DropletDrop-* /tmp/artefacts/SHA256SUMS.txt
