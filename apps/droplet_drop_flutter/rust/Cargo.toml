[package]
name = "rust_lib_droplet_drop"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "1"
serde_json = "1"
tokio = { version = "1.47", features = ["rt-multi-thread", "sync"] }
drop_core = { path = "../../../crates/drop_core" }
drop_transfer = { path = "../../../crates/drop_transfer" }
drop_discovery = { path = "../../../crates/drop_discovery" }
drop_storage = { path = "../../../crates/drop_storage" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
